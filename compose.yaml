# Final deployment per #25: timetagger-pattern Traefik labels. Router
# `wordament-rtr` references the `chain-wordament` chain declared in the file
# provider's `middlewares-chains.yml` (rate-limit + https-redirectscheme +
# secure-headers + compress; no CSP — the app serves its own, cf. #24; no
# ddns-allowlist — remote players must work). The wortschatz service itself is
# stateless: PORT env, no volume. The image is pulled from GHCR, pinned to an
# exact sha-<full-sha> tag of a main-branch merge build (#27, #32); the
# operator bumps that pin per release and rolls back by re-pinning.
# See docs/OPERATOR-STEPS.md for the file
# provider chain, the per-host TLS entrypoint line and the deployment walk.
services:
  wortschatz:
    image: ghcr.io/thom404/wortschatz:sha-88ccecd175d95aa73f107b0d9cdf266a6cb600e6
    restart: unless-stopped
    environment:
      - PORT=3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.wordament-rtr.rule=Host(`wordament.${DOMAIN:-phanthom.cc}`)
      - traefik.http.routers.wordament-rtr.entrypoints=https
      - traefik.http.routers.wordament-rtr.tls=true
      - traefik.http.routers.wordament-rtr.tls.certresolver=dns-cloudflare
      - traefik.http.routers.wordament-rtr.middlewares=chain-wordament@file
      - traefik.http.services.wordament-svc.loadbalancer.server.port=3000
    networks:
      - ${TRAEFIK_NETWORK:-reverse-proxy}

networks:
  reverse-proxy:
    external: true
