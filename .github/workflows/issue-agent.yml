name: Issue agent

# A human adds the `agent-run` label to start a headless agent on a fully
# specified issue, or the workflow is started by hand for a specific issue.
# `ready-for-agent` is a marker only and starts nothing.
# See docs/adr/0006-autonomous-issue-agent.md.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: number

# One run per issue at a time; a second run queues rather than cancels the first.
concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

# The push and every `gh` call authenticate with AGENT_GITHUB_TOKEN so the CI
# workflow starts on the pull request (ADR-0004); the GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  implement:
    # Only the `agent-run` label on an issue from the owner, a member, or a
    # collaborator starts a run. An outsider cannot inject work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'agent-run' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve issue
        id: issue
        run: |
          set -euo pipefail
          title="$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')"
          slug="$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -d- -f1-5)"
          {
            echo "title=$title"
            echo "branch=feature/${ISSUE_NUMBER}-${slug}"
          } >> "$GITHUB_OUTPUT"

      # The first guard that matches wins: it drops the `agent-run` command
      # label, comments why, and exits without ever adding `agent-running`.
      # The blocker check fails closed.
      - name: Skip guard
        id: guard
        env:
          BRANCH: ${{ steps.issue.outputs.branch }}
        run: |
          set -euo pipefail
          skip() {
            gh issue edit "$ISSUE_NUMBER" --remove-label agent-run || true
            gh issue comment "$ISSUE_NUMBER" --body "$1"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${BRANCH}" \
            --jq '.[].ref' | grep -q .; then
            skip "Skipping: branch \`${BRANCH}\` already exists."
          fi
          referencing_pr='.[] | select(((.body // "") + " " + .title) | test("#'"$ISSUE_NUMBER"'([^0-9]|$)")) | .number'
          pr="$(gh pr list --state open --limit 100 --json number,title,body --jq "$referencing_pr" | head -n1)"
          if [ -n "$pr" ]; then
            skip "Skipping: pull request #${pr} already references this issue."
          fi
          # The summary counts only open, same-repo blockers. Fail closed if the
          # lookup fails, and if it disagrees with the dependency list.
          open_blocker_count="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '.issue_dependencies_summary.blocked_by // 0')"
          if [ "$open_blocker_count" -gt 0 ]; then
            blocker_list="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/dependencies/blocked_by" \
              --jq '.[] | select(.state == "open" and .repository.full_name == env.GITHUB_REPOSITORY) | "#\(.number)"' \
              | paste -sd, - | sed 's/,/, /g')"
            if [ -z "$blocker_list" ]; then
              echo "::error::Issue #${ISSUE_NUMBER} reports ${open_blocker_count} open blocker(s), but none could be listed."
              exit 1
            fi
            skip "Skipping: blocked by ${blocker_list}. Add \`agent-run\` again once the blockers close."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # The guard passed, so the run is in flight: drop the command label and
      # show the status marker until the cleanup step below clears it.
      - name: Mark running
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label agent-run || true
          gh issue edit "$ISSUE_NUMBER" --add-label agent-running

      # A skip stops here: no dependencies, no agent, just the comment above.
      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install OpenCode CLI
        if: steps.guard.outputs.skip != 'true'
        run: npm install --global opencode-ai@latest

      - name: Run issue-implementer
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "1"
        run: |
          set -euo pipefail
          opencode run --agent issue-implementer \
            "Implement the specification in GitHub issue #${ISSUE_NUMBER}."

      # A clean tree with needs-info is a successful no-op (the spec gate); a
      # clean tree without it is a failure.
      - name: Spec gate
        id: gate
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "action=proceed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' \
            | grep -qx needs-info; then
            echo "action=noop" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The agent made no changes and did not apply needs-info."
            exit 1
          fi

      - name: Lint
        if: steps.gate.outputs.action == 'proceed'
        run: npm run lint

      - name: Typecheck
        if: steps.gate.outputs.action == 'proceed'
        run: npm run typecheck

      - name: Test
        if: steps.gate.outputs.action == 'proceed'
        run: npm test

      - name: Open pull request
        if: steps.gate.outputs.action == 'proceed'
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.issue.outputs.branch }}
          TITLE: ${{ steps.issue.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "wortschatz-agent"
          git config user.email "wortschatz-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          printf '%s\n\nImplements #%s\n' "$TITLE" "$ISSUE_NUMBER" > /tmp/commit-message
          git commit -F /tmp/commit-message
          git push \
            "https://x-access-token:${AGENT_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
          printf 'Closes #%s\n\nImplemented by the issue agent for issue #%s.\n' \
            "$ISSUE_NUMBER" "$ISSUE_NUMBER" > /tmp/pr-body
          pr_url="$(gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$TITLE" --body-file /tmp/pr-body)"
          gh issue comment "$ISSUE_NUMBER" --body \
            "Opened ${pr_url} (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"

      # The status marker never lingers: this runs on success and on failure.
      - name: Clear running
        if: always()
        run: gh issue edit "$ISSUE_NUMBER" --remove-label agent-running || true

      - name: Report failure
        if: failure() || cancelled()
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label agent-run || true
          gh issue edit "$ISSUE_NUMBER" --remove-label agent-running || true
          gh issue edit "$ISSUE_NUMBER" --remove-label ready-for-agent || true
          gh issue edit "$ISSUE_NUMBER" --add-label ready-for-human || true
          gh issue comment "$ISSUE_NUMBER" --body \
            "The issue agent run failed and this issue needs a human. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
